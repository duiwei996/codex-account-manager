name: Build and publish signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-project-release
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.repository == 'duiwei996/codex-account-manager' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/pull-request-validation.yml
  preflight:
    needs: checks
    if: ${{ github.repository == 'duiwei996/codex-account-manager' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Select the next release version
        id: version
        shell: bash
        run: |
          git tag --list 'v*' > version-tags.txt
          version="$(node scripts/next-release-version.mjs version-tags.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.version.outputs.version }}

  signed-bundles:
    needs: preflight
    # All platforms build the same reserved version from main.
    if: ${{ github.repository == 'duiwei996/codex-account-manager' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    env:
      CODEX_SWITCHER_BUILD_TARGET: ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 1  # avoid concurrent writes to the shared latest.json asset
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            tauriScript: pnpm tauri
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            tauriScript: pnpm tauri:win
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            tauriScript: pnpm tauri
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            tauriScript: pnpm tauri

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.18.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: false

      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Set release version
        run: node scripts/bump-version.mjs ${{ needs.preflight.outputs.version }}
      - name: Validate production updater signing configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-release.mjs
      - name: Build signed installers and upload to draft Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER_ENABLED: 'true'
        with:
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: 'Codex 账号管理器 v__VERSION__'
          releaseBody: '正式版安装包及签名自动更新文件。Windows 使用 setup.exe，macOS 使用 dmg，Linux 使用 AppImage、deb 或 rpm。'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          retryAttempts: 3
          tauriScript: ${{ matrix.tauriScript }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

  publish:
    needs: [preflight, signed-bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to inspect unpublished draft Releases
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set release version
        run: node scripts/bump-version.mjs ${{ needs.preflight.outputs.version }}
      - name: Check and publish the complete release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release view "v${version}" --json isDraft,assets > release-assets.json
          gh release download "v${version}" --pattern latest.json --dir release-review
          node scripts/verify-release.mjs release-review/latest.json release-assets.json
          gh release upload "v${version}" release-review/latest.json --clobber
          gh release edit "v${version}" --draft=false --latest
